packages:
  - "extensions/*"
  - "packages/packages/*"

minimumReleaseAgeExclude:
  - "@earendil-works/*"
  - "@nielpattin/*"
  - "@mariozechner/*"
  - '@plannotator/pi-extension'
  - '@plannotator/webtui@0.1.0'
  - '@cortexkit/*'
allowBuilds:
  "@google/genai": true
  esbuild: true
  koffi: true
  protobufjs: true
  better-sqlite3: true
  tree-sitter-bash: true
  onnxruntime-node: set this to true or false
  sharp: set this to true or false

# Supply chain security
minimumReleaseAge: 7200 # 5 days (or 1440 for 1 day)
blockExoticSubdeps: true

# Extra hardening (recommended in v11)
strictDepBuilds: true
