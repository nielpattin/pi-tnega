name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install ripgrep
        # Pi downloads rg when it is absent. Shared runners can rate-limit that download.
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install ripgrep -y --no-progress
          else
            sudo apt-get install -y ripgrep
          fi
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm run typecheck
      - name: Test Windows type-checker regression
        if: runner.os == 'Windows'
        run: pnpm exec vitest run tests/type-checker.test.ts
      - name: Build
        run: pnpm run build
      - name: Test
        run: pnpm run test
      - name: Lint dead code
        run: pnpm run lint:dead
